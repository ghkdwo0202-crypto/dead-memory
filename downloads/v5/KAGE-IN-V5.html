    <style>:root {
  color-scheme: dark;
  --ink: #0e1516;
  --paper: #e9e4d1;
  --muted: #9ca7a1;
  --red: #d65e50;
  --gold: #d7b97b;
  --line: #e9e4d12a;
  font-family: Georgia, "Noto Serif KR", serif;
  background: #080e0f;
  color: var(--paper);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  border: 1px solid var(--line);
  background: #162021;
  padding: 13px 19px;
  transition:
    background 0.15s,
    border 0.15s;
}
button:hover,
button:focus-visible {
  background: #263333;
  border-color: var(--gold);
  outline: 2px solid #d7b97b55;
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
button.primary {
  background: var(--red);
  color: #131819;
  border-color: var(--red);
  font-weight: bold;
}
#app {
  position: absolute;
  width: min(100vw, 177.7778vh);
  height: min(100vh, 56.25vw);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  overflow: hidden;
  background: #121b1c;
}
#world {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#overlay {
  position: absolute;
  inset: 0;
  overflow: auto;
  padding: 4% 5%;
  background: #0b1115e8;
  z-index: 5;
}
#overlay.title {
  background: linear-gradient(
    90deg,
    #0b1115fc 0%,
    #0b1115e8 34%,
    #0b111500 73%
  );
  padding: 6% 7%;
}
.hidden {
  display: none !important;
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.24em;
  color: var(--gold);
  font:
    11px ui-monospace,
    monospace;
  margin-bottom: 15px;
}
.logo {
  font-size: clamp(35px, 5.5vw, 88px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.08em;
  margin: 0;
}
.logo em {
  font-style: normal;
  color: var(--red);
}
.subtitle {
  font:
    12px ui-monospace,
    monospace;
  letter-spacing: 0.3em;
  margin: 17px 0 0;
  color: var(--muted);
}
.title-nav {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  width: 28%;
  min-width: 190px;
  margin-top: 5%;
}
.title-nav button {
  background: transparent;
  text-align: left;
  border: 0;
  border-left: 2px solid transparent;
  padding: 9px 16px;
  font-size: clamp(12px, 1.4vw, 20px);
}
.title-nav button:hover,
.title-nav button:focus-visible {
  background: #e9e4d111;
  border-left-color: var(--red);
}
.title-nav small {
  font:
    9px ui-monospace,
    monospace;
  float: right;
  line-height: 24px;
  color: var(--muted);
}
.title-note {
  position: absolute;
  bottom: 9%;
  font: 11px/1.7 sans-serif;
  color: var(--muted);
  width: 32%;
  max-width: 390px;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 3%;
}
.page-head h1 {
  font-size: clamp(24px, 3vw, 42px);
  margin: 0 0 8px;
  font-weight: 500;
}
.page-head p,
.muted {
  color: var(--muted);
  font: 13px/1.7 sans-serif;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 17px;
}
.hero-card {
  text-align: left;
  padding: 22px;
  position: relative;
  min-height: 240px;
}
.hero-card .glyph {
  font-size: 65px;
  line-height: 1.1;
  display: block;
  margin: 12px 0;
  color: var(--hero);
  text-shadow: 0 0 45px #fff1;
}
.hero-card h2 {
  font-size: 27px;
  margin: 16px 0 6px;
}
.hero-card p {
  font: 13px/1.8 sans-serif;
  color: var(--muted);
  margin: 12px 0;
}
.hero-card small {
  font: 11px monospace;
  color: var(--gold);
}
.hero-card img {
  height: 170px;
  width: 100%;
  object-fit: contain;
}
.bottom-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 24px;
}
.panel {
  max-width: 900px;
  margin: auto;
  padding: 27px;
  background: #152021;
  border: 1px solid var(--line);
}
.support-choices {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 20px 0;
}
.support-choices button {
  font-size: 14px;
}
.support-choices button.selected {
  border-color: var(--gold);
  background: #d7b97b17;
}
.brief {
  font: 14px/1.8 sans-serif;
  color: var(--muted);
}
.control-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 24px 0;
}
.control-grid span {
  font: 12px sans-serif;
  color: var(--muted);
  padding: 14px;
  border: 1px solid var(--line);
}
kbd {
  color: var(--paper);
  font: 13px monospace;
  margin-right: 9px;
}
.tabs {
  display: flex;
  gap: 8px;
  margin: 10px 0 18px;
}
.tabs .selected {
  border-color: var(--gold);
  color: var(--gold);
}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}
.art-card {
  padding: 0;
  overflow: hidden;
  text-align: left;
}
.art-card .art-frame {
  height: 165px;
}
.art-card strong,
.art-card small {
  display: block;
  padding: 12px 14px 0;
}
.art-card small {
  padding-bottom: 14px;
  color: var(--muted);
  font: 11px sans-serif;
}
.art-frame {
  background: repeating-linear-gradient(
    45deg,
    #121b1c,
    #121b1c 14px,
    #152021 14px,
    #152021 15px
  );
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.art-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: auto;
}
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 20px;
  color: #889590;
  font: 11px/1.5 sans-serif;
}
.placeholder b {
  font-size: 40px;
  color: #adb6a844;
  font-family: Georgia, serif;
}
.detail-image {
  height: 68%;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050808;
}
.detail-image img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transform-origin: center;
  transition: transform 0.1s;
}
.detail-info {
  font: 12px/1.6 sans-serif;
  color: var(--muted);
  margin-top: 8px;
}
.settings-row {
  display: flex;
  justify-content: space-between;
  gap: 30px;
  align-items: center;
  padding: 17px 0;
  border-bottom: 1px solid var(--line);
  font: 14px sans-serif;
}
.settings-row input[type="range"] {
  width: 160px;
  accent-color: var(--red);
}
.settings-row input[type="checkbox"] {
  accent-color: var(--red);
  width: 20px;
  height: 20px;
}
.mini {
  font: 11px sans-serif;
  color: var(--muted);
}
#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font: 12px sans-serif;
}
.hud-top {
  position: absolute;
  left: 3%;
  top: 4%;
  display: flex;
  gap: 22px;
  align-items: center;
}
.portrait-mark {
  font-size: 36px;
  color: var(--gold);
  font-family: Georgia, serif;
}
.hp-wrap {
  width: 200px;
}
.hp-line {
  height: 7px;
  background: #ffffff18;
  margin: 9px 0;
}
.hp-fill {
  height: 100%;
  background: var(--red);
}
.room-label {
  position: absolute;
  top: 4%;
  right: 3%;
  text-align: right;
  font: 12px/1.8 sans-serif;
  color: #bdc7bd;
}
.skillbar {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}
.skill {
  padding: 12px 15px;
  min-width: 120px;
  background: #0a1213db;
  border: 1px solid var(--line);
  font: 12px/1.7 sans-serif;
}
.skill b {
  color: var(--gold);
  margin-right: 8px;
}
.skill small {
  display: block;
  color: var(--muted);
  font-size: 10px;
}
.gauge {
  height: 3px;
  background: #d7b97b33;
  margin-top: 7px;
}
.gauge span {
  display: block;
  height: 100%;
  background: var(--gold);
}
.combat-hint {
  position: absolute;
  bottom: 15%;
  left: 3%;
  font: 10px/1.9 sans-serif;
  color: #a4afa5;
}
.combat-msg {
  position: absolute;
  top: 16%;
  width: 100%;
  text-align: center;
  color: var(--gold);
  font-size: 15px;
}
.pause-button {
  position: absolute;
  right: 3%;
  bottom: 4%;
  pointer-events: auto;
  padding: 10px;
}
#toast {
  position: absolute;
  z-index: 15;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  max-width: 75%;
  padding: 10px 18px;
  background: #080e0ff2;
  border: 1px solid var(--gold);
  font: 12px/1.7 sans-serif;
  display: none;
}
#build-label {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font: 8px monospace;
  letter-spacing: 0.1em;
  color: #80918b;
  pointer-events: none;
  z-index: 8;
}
.stats {
  display: flex;
  gap: 30px;
  margin: 24px 0;
}
.stats b {
  font-size: 32px;
  display: block;
  margin-bottom: 8px;
}
.stats span {
  color: var(--muted);
  font: 12px sans-serif;
}
.reward-card {
  min-height: 180px;
  text-align: left;
  padding: 22px;
}
.reward-card h2 {
  font-size: 23px;
}
.reward-card p {
  font: 13px/1.8 sans-serif;
  color: var(--muted);
}
.catalogue {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  max-height: 340px;
  overflow: auto;
}
.catalogue div {
  padding: 13px;
  background: #152021;
  font: 12px/1.7 sans-serif;
  border: 1px solid var(--line);
}
.catalogue small {
  display: block;
  color: var(--muted);
}
@media (max-width: 900px) {
  #overlay {
    padding: 3%;
  }
  .hero-card {
    padding: 12px;
    min-height: 180px;
  }
  .hero-card .glyph {
    font-size: 40px;
    margin: 2px;
  }
  .hero-card h2 {
    font-size: 20px;
    margin: 7px 0;
  }
  .hero-card p,
  .brief,
  .page-head p {
    font-size: 11px;
  }
  .hero-card img {
    height: 80px;
  }
  .title-note {
    font-size: 9px;
    bottom: 7%;
  }
  .title-nav {
    gap: 0;
    margin-top: 3%;
  }
  .title-nav button {
    padding: 5px 12px;
  }
  .gallery-grid {
    gap: 8px;
  }
  .art-card .art-frame {
    height: 90px;
  }
  .tabs button {
    padding: 8px;
    font-size: 11px;
  }
  .page-head {
    margin-bottom: 10px;
  }
  .page-head button,
  .bottom-actions button {
    padding: 9px 13px;
    font-size: 12px;
  }
  .skill {
    min-width: 85px;
    padding: 8px;
    font-size: 10px;
  }
  .skillbar {
    gap: 5px;
  }
  .panel {
    padding: 17px;
  }
  .control-grid {
    margin: 14px 0;
    gap: 6px;
  }
  .control-grid span {
    padding: 8px;
    font-size: 10px;
  }
  .settings-row {
    padding: 10px 0;
    font-size: 12px;
  }
  .hp-wrap {
    width: 140px;
  }
  .reward-card {
    padding: 14px;
    min-height: 130px;
  }
  .reward-card h2 {
    font-size: 18px;
  }
  .placeholder {
    font-size: 9px;
    gap: 6px;
  }
  .placeholder b {
    font-size: 24px;
  }
}

function toast(text) {

function beep(freq = 330) {
  if (!options.volume) return;
  try {
    audio ??= new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(),
      g = audio.createGain();
    o.frequency.value = freq;
    o.type = "triangle";
    g.gain.setValueAtTime(options.volume * 0.08, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.08);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + 0.08);
  } catch {}
}
function view(name, html, bindings = {}) {

  screen = name;
  overlay.className = name === "title" ? "title" : "";
  overlay.innerHTML = html;
  hud.classList.add("hidden");
  selection = 0;
  for (const [id, fn] of Object.entries(bindings)) {
    const e = $(id);
    if (e) e.onclick = fn;
  }
  overlay
    .querySelectorAll("button")
    .forEach((b) => b.addEventListener("click", () => beep(440)));
  const first = overlay.querySelector("button:not(:disabled)");
  first?.focus({ preventScroll: true });
}

}

  view(
    "codex",
    head(
      "IMPLEMENTATION STATUS",
      "V5, 현재 가능한 것.",
      "O12 / S4 / Q48 명명과 조합 레지스트리. 실제 동작과 데이터 정의를 구분합니다.",
    ) +
      `<p class="brief">구현: 3인 기본타·E / 지원 4종 / 4속성 예약 / 방·보상·문지기 / 갤러리·저장.<br>미구현: 나머지 O9, Q48의 고유 판정, O/S 3분기, 5막 60분, 라이벌 실전, 정식 아트·음악.<br>조작: WASD 이동 · 마우스 조준 · 좌클릭 기본타 · E 공격기 · 우클릭 지원 · Space 회피 · 1/2/3/4 화/수/뇌/풍 · Esc 일시정지.</p><div class="catalogue">${OFFENSES.map((o) => `<div>${o.id} ${o.name}<small>${o.primary} / E ${o.active}</small><small>${o.implemented ? "기본 동작 구현" : "데이터만 정의 · 미구현"}</small></div>`).join("")}${FUSIONS.map((q) => `<div>${q.name}<small>${q.offenseId} × ${q.supportId} · ${q.behavior}</small><small>고유 판정 미구현</small></div>`).join("")}</div>`,
    { back },
  );
}
function menuKeys(e) {
  const buttons = [...overlay.querySelectorAll("button:not(:disabled)")];
  let current = buttons.indexOf(document.activeElement);
  if (["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft"].includes(e.code)) {
    e.preventDefault();
    if (screen === "detail" && ["ArrowLeft", "ArrowRight"].includes(e.code)) {
      $(e.code === "ArrowLeft" ? "previous" : "next").click();
      return;
    }
    const step = ["ArrowDown", "ArrowRight"].includes(e.code) ? 1 : -1;
    selection = (Math.max(0, current) + step + buttons.length) % buttons.length;
    buttons[selection]?.focus({ preventScroll: false });
  }
  if (e.code === "Escape") {
    e.preventDefault();
    $("back")?.click();
  }
}
window.addEventListener("keydown", (e) => {
  if (
    ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(
      e.code,
    )
  )
    e.preventDefault();
  if (screen !== "combat") {
    menuKeys(e);
    return;
  }
  if (e.code === "Escape") {
    pause();
    return;
  }
  keys.add(e.code);
  if (e.repeat) return;
  if (e.code === "Space") edge.dash = true;
  if (e.code === "KeyE") edge.active = true;
  if (e.code === "KeyQ") edge.fusion = true;
  const index = ["Digit1", "Digit2", "Digit3", "Digit4"].indexOf(e.code);
  if (index >= 0) edge.element = index;
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
canvas.addEventListener("pointermove", (e) => {
  const rect = canvas.getBoundingClientRect();
  aim = {
    x: ((e.clientX - rect.left) * 1440) / rect.width,
    y: ((e.clientY - rect.top) * 810) / rect.height,
  };
});
canvas.addEventListener("pointerdown", (e) => {
  if (screen !== "combat") return;
  if (e.button === 0) attack = true;
  if (e.button === 2) edge.support = true;
});
window.addEventListener("pointerup", (e) => {
  if (e.button === 0) attack = false;
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("blur", () => {
  clearInput();
  if (screen === "combat") pause();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && screen === "combat") pause();
});
let hudAt = 0;
function frame(now) {
  const dt = Math.min(0.08, (now - last) / 1000 || 0);
  last = now;
  if (run && screen === "combat") {
    const before = run.t,
      hits = run.hits;
    run.tick(dt, {
      x: Number(keys.has("KeyD")) - Number(keys.has("KeyA")),
      y: Number(keys.has("KeyS")) - Number(keys.has("KeyW")),
      attack,
      aim,
      ...edge,
    });
    if (run.t > before) for (const k of Object.keys(edge)) delete edge[k];
    if (run.hits > hits) beep(run.heroId === "HERO_GORO" ? 110 : 520);
    if (run.mode !== lastMode) {
      lastMode = run.mode;
      if (run.mode === "reward") rewards();
      else if (["dead", "victory"].includes(run.mode)) result();
    }
    if (now - hudAt > 80 && screen === "combat") {
      updateHUD();
      hudAt = now;
    }
  }
  draw(
    ctx,
    screen === "title" || screen === "heroes" || screen === "exit" ? null : run,
    now / 1000,
    options,
  );
  requestAnimationFrame(frame);
}
async function boot() {
  try {
    manifest =
      window.KAGE_GALLERY ||
      (await fetch("../assets/kage-in/gallery/gallery_manifest.json").then(
        (r) => {
          if (!r.ok) throw Error(r.status);
          return r.json();
        },
      ));
    if (!Array.isArray(manifest.entries)) throw Error("Invalid manifest");
    gallery = new GalleryState(manifest, store);
    title();
    requestAnimationFrame(frame);
    window.kageV5 = {
      snapshot: () => ({
        screen,
        run: run?.snapshot() || null,
        persistent: store.persistent,
        gallery: gallery.entries.map((e) => ({
          id: e.id,
          unlocked: gallery.available(e, options.reveal),
        })),
      }),
      version: "V5-web-slice",
    };
  } catch (e) {
    overlay.textContent =
      "갤러리 목록을 불러오지 못했습니다. 개발 서버 또는 단독 HTML 빌드로 실행하세요.";
    console.error(e);
  }
}
boot();

return {};
})();
})();</script>
